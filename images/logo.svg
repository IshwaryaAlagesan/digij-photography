<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f97316"/>
      <stop offset="40%" style="stop-color:#ec4899"/>
      <stop offset="100%" style="stop-color:#be123c"/>
    </linearGradient>
    <linearGradient id="topGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#fbbf24"/>
      <stop offset="100%" style="stop-color:#f59e0b"/>
    </linearGradient>
    <radialGradient id="lensGrad" cx="45%" cy="40%">
      <stop offset="0%" style="stop-color:#fff;stop-opacity:0.9"/>
      <stop offset="100%" style="stop-color:#1e1b4b;stop-opacity:1"/>
    </radialGradient>
  </defs>

  <!-- Camera body -->
  <rect x="20" y="70" width="160" height="100" rx="18" ry="18" fill="url(#bodyGrad)" stroke="#1a1a1a" stroke-width="4"/>

  <!-- Camera top ridge -->
  <rect x="60" y="58" width="80" height="20" rx="8" ry="8" fill="url(#topGrad)" stroke="#1a1a1a" stroke-width="3"/>

  <!-- Flash bump -->
  <rect x="38" y="62" width="18" height="12" rx="4" fill="#22c55e" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Shutter button -->
  <circle cx="155" cy="63" r="8" fill="#fbbf24" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Lens outer ring -->
  <circle cx="100" cy="118" r="44" fill="#fff" stroke="#1a1a1a" stroke-width="5"/>
  <circle cx="100" cy="118" r="38" fill="#1a1a1a"/>

  <!-- Rainbow aperture blades -->
  <g transform="translate(100,118)">
    <!-- Red blade -->
    <path d="M0,0 L-10,-36 Q0,-40 10,-36 Z" fill="#ef4444" transform="rotate(0)"/>
    <!-- Orange blade -->
    <path d="M0,0 L-10,-36 Q0,-40 10,-36 Z" fill="#f97316" transform="rotate(51)"/>
    <!-- Yellow blade -->
    <path d="M0,0 L-10,-36 Q0,-40 10,-36 Z" fill="#eab308" transform="rotate(102)"/>
    <!-- Green blade -->
    <path d="M0,0 L-10,-36 Q0,-40 10,-36 Z" fill="#22c55e" transform="rotate(153)"/>
    <!-- Cyan blade -->
    <path d="M0,0 L-10,-36 Q0,-40 10,-36 Z" fill="#06b6d4" transform="rotate(204)"/>
    <!-- Blue blade -->
    <path d="M0,0 L-10,-36 Q0,-40 10,-36 Z" fill="#3b82f6" transform="rotate(255)"/>
    <!-- Purple blade -->
    <path d="M0,0 L-10,-36 Q0,-40 10,-36 Z" fill="#a855f7" transform="rotate(306)"/>
  </g>

  <!-- Lens center -->
  <circle cx="100" cy="118" r="14" fill="url(#lensGrad)"/>
  <circle cx="100" cy="118" r="6" fill="#0f0f23"/>

  <!-- Lens highlights -->
  <circle cx="93" cy="111" r="3" fill="white" opacity="0.7"/>
  <circle cx="106" cy="108" r="1.5" fill="white" opacity="0.5"/>

  <!-- Viewfinder -->
  <rect x="145" y="82" width="22" height="16" rx="3" fill="#1a1a1a" stroke="#555" stroke-width="1"/>
</svg>
